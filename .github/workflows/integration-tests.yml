name: Integration Tests

on:
  push:
    branches:
      - main
      - 'feature/issue-*'
  pull_request:
    branches:
      - main
      - 'feature/issue-*'
  schedule:
      - cron: '20 8 * * *'
      - cron: '55 17 * * *'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Download ftp
        run: wget "https://downloader.disk.yandex.ru/disk/9896c13c2bbde38ed413cd0327d5b6bd7c54aa24a3a0859de48ba5aef2db8d0a/69ca3354/dJMZ6Bla5hgccBI1MvRwdvuqInz9KQPfjbu77S5v6aHDAgLpYhE0DMz4E3JXyZIlc44J3CppMu92-HPyQgtZJw%3D%3D?uid=0&filename=ftp.conf&disposition=attachment&hash=CRi31lU4Z2cAQ51zQvPB91zs4EsoZfMnPlU2R4MpXWpjand/sqqJLWkOEKVSrLL2q/J6bpmRyOJonT3VoXnDag%3D%3D%3A&limit=0&content_type=text%2Fplain&owner_uid=1011034159&fsize=44&hid=19ac924c74fbf3c8c5d0ac81ac625cfb&media_type=settings&tknv=v3" -O ftp.conf

      - name: ftp debug
        run: touch report.zip && ls && ftp -e "$(cat ftp.conf)" curlylab.ru

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore app/debug.keystore \
          -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US" \
          -storepass android -keypass android

      - name: Run instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel
          cores: 2
          ram-size: 2048M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics
          script: |
            adb kill-server
            adb start-server
          
            adb wait-for-device
            sleep 30
          
            adb shell input keyevent 82 || true
          
            ./gradlew connectedAndroidTest
            
      - name: Create report HTML
        if: always()
        run: zip -r report.zip /home/runner/work/curlylab-android/curlylab-android/app/build/reports/androidTests/connected/debug && ftp -s ftp.conf curlylab.ru
