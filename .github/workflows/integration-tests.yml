name: Integration Tests

on:
  push:
    branches:
      - main
      - 'feature/issue-*'
  pull_request:
    branches:
      - main
      - 'feature/issue-*'
  schedule:
      - cron: '20 8 * * *'
      - cron: '55 17 * * *'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore app/debug.keystore \
          -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US" \
          -storepass android -keypass android

      - name: Clone app repo
        run: git clone https://github.com/Fairies-Pixels/curlylab.git curlylab

      - name: Download env
        run: wget https://downloader.disk.yandex.ru/disk/e5e26f499d84c78696bba8a72add30eee4198b6666eea229492f034c759246fb/69c9c494/dJMZ6Bla5hgccBI1MvRwdhiOjfL8vs2eyhgQVYHhmeq1V-tI9Renc84DPCO3aA3Ik4bZEfqErTiXjEjGae4MFQ%3D%3D?uid=0&filename=env.sh&disposition=attachment&hash=v2aIz3wGya/145gq0IbwfFbkXHwl2Y2ubRS2/UtZMQVRwA3RrLRtlsTAJF%2BzYxCOq/J6bpmRyOJonT3VoXnDag%3D%3D%3A&limit=0&content_type=text%2Fx-shellscript&owner_uid=1011034159&fsize=870&hid=97c7185d69e963a8e89ae85ade45bf1c&media_type=compressed&tknv=v3 -O env.sh

      - name: Download model
        run: wget https://downloader.disk.yandex.ru/disk/6337bed7912d8976f39b5da99278a97950ef576047832d7ee83e6749a316ba64/69c9c541/dJMZ6Bla5hgccBI1MvRwdqlNv7n3kJc6WHu_SlpBww1A-XDM5cGs0XyMANWTzCIIVEPKozJZ2gqLUDz6BgitVw%3D%3D?uid=0&filename=swa_convnext.pt&disposition=attachment&hash=PkZMpu754Bqqpd8WLMQcO3FqF1JyD51bCruwdji0vhBKl94WflRJt77E7KCtS95rq/J6bpmRyOJonT3VoXnDag%3D%3D%3A&limit=0&content_type=application%2Fzip&owner_uid=1011034159&fsize=350413157&hid=408ec0ba32625e264d7af6af7ebf9604&media_type=compressed&tknv=v3 -O swa_convnext.pt

      - name: Bring up app
        run: source curlylab/docker/startup.sh $JAVA_HOME

      - name: Run instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel
          cores: 2
          ram-size: 2048M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics
          script: |
            adb kill-server
            adb start-server
          
            adb wait-for-device
            sleep 30
          
            adb shell input keyevent 82 || true
          
            ./gradlew connectedAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=fairies.pixels.curlyLabAndroid.integration
